name: Plugin checks
on:
  push:
    branches: [feat/initial-mistral-usage]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install fastapi
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile dashboard/plugin_api.py scripts/configure.py
      - run: node --check desktop/plugin.js
      - run: python -m json.tool dashboard/manifest.json
